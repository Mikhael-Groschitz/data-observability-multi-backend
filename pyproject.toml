[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsdados"
version = "0.1.0"
description = "Observabilidade de dados: detecta pipelines que rodam com sucesso mas entregam dado errado"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5,<2",
    "pydantic>=2.13,<3",
    "structlog>=26.1,<27",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[project.scripts]
obsdados = "obsdados.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["obsdados"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "S", "PL"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
