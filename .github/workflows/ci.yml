name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instala uv
        run: python -m pip install uv
      - name: instala dependências
        run: python -m uv sync --extra dev
      - name: sobe o Postgres de teste
        run: docker compose up -d --wait postgres
      - name: lint
        run: python -m uv run ruff check .
      - name: tipagem
        run: python -m uv run mypy obsdados tests
      - name: testes
        run: python -m uv run pytest
